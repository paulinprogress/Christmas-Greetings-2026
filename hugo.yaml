# Base configuration
baseURL: 'https://paulinprogress.github.io/Christmas-Greetings-2026/'
title: 'Merry Christmas!'
locale: 'en-us'

# Output/publish directory
publishDir: "public"

# Theme configuration
theme: ['main']

# Markdown configuration
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      hardWraps: true
      unsafe: true
      xhtml: false
      parser:
        autoHeadingID: true
    extensions: # LaTeX line-break fix
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
          inline:
            - ["$", "$"]
  tableOfContents:
    startLevel: 2
    endLevel: 4
